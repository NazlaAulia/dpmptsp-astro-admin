# Shared rate-limit zones. Must live in http{}, so this is included from the
# top of the rendered config rather than from inside a server block.
#
# $binary_remote_addr is the real client address: realip.conf has already
# replaced it from CF-Connecting-IP by the time this is evaluated.
limit_req_zone $binary_remote_addr zone=cms_login:10m rate=5r/m;
