proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host  $http_host;

# The apps derive same-origin decisions from X-Forwarded-Host, so a
# client-supplied copy must never survive; proxy_set_header overwrites it.
# $http_host rather than $host: $host drops the port, so every same-origin
# comparison failed on a non-default port and refused the login form.
proxy_set_header CF-Connecting-IP  $remote_addr;

# Websocket / HMR passthrough. Harmless in production, required for `make dev`.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_read_timeout 60s;
proxy_send_timeout 60s;
