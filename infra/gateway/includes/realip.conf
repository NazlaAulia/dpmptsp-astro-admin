# Recovering the real client IP.
#
# This gateway does not face the internet. cloudflared runs on the host network
# and proxies to 127.0.0.1:<port>, so from nginx's point of view EVERY request
# arrives from the docker bridge gateway. Matching an allow/deny list against
# $remote_addr without this file would compare every request to the same bridge
# address and either allow everyone or deny everyone.
#
# Cloudflare puts the true client address in CF-Connecting-IP.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header   CF-Connecting-IP;
real_ip_recursive on;

# CF-Connecting-IP is only trustworthy because the sole route in is the tunnel:
# this gateway binds 127.0.0.1 and is never published on 0.0.0.0. If that bind
# is ever widened, a direct caller can forge this header and walk straight
# through the IP policy below. Do not widen it.
