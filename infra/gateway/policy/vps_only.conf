# admin_access = vps_only
#
# The real enforcement is NOT this file: it is that admin.<domain> is simply
# absent from the cloudflared ingress, so there is no public route at all. Admin
# is then reached over an SSH port-forward to the loopback listener.
#
# This is defence in depth for the case where someone adds the tunnel route back
# without remembering why it was missing.
geo $admin_ip_ok {
    default 0;
    127.0.0.1/32 1;
}
