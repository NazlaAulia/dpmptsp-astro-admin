# Applied by `make dev` on top of docker-compose.yml.
services:
  web:
    build:
      target: deps
    command: pnpm --filter ./apps/web dev --host 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
    volumes:
      - ./:/app
      # Anonymous volumes shadow the bind mount. Without them the host's
      # node_modules (which may not exist) hides the container's installed
      # modules and the dev server dies on its first import.
      - /app/node_modules
      - /app/apps/web/node_modules

  admin:
    build:
      target: deps
    command: pnpm --filter ./apps/admin dev --host 0.0.0.0 --port 3000
    environment:
      NODE_ENV: development
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
